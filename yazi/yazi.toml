# ============================================================
# Yazi 文件管理器配置  ~/.config/yazi/yazi.toml
# 官方文档：https://yazi-rs.github.io/docs/configuration/yazi
# 在终端输入 y 打开（退出后 shell 会进入你最后所在的目录）
#
# 常用按键：
#   h/j/k/l  上级目录 / 下 / 上 / 进入目录或打开文件
#   空格      选中          y / x / p   复制 / 剪切 / 粘贴
#   a        新建（结尾加 / 是目录）     r  重命名     d  删到废纸篓
#   .        显示/隐藏隐藏文件           /  搜索当前目录
#   z        zoxide 跳转                Z  fzf 模糊跳转
#   o        用默认程序打开              O  选择打开方式
#   Tab      查看文件详细信息            ~  帮助（所有按键）
#   q        退出
# 右侧预览：图片 / PDF / 视频缩略图 / 压缩包内容 / 代码高亮 / JSON 等
# ============================================================

[mgr]
# 三栏比例：上级目录 / 当前目录 / 预览
ratio = [1, 3, 4]
show_hidden = true
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_symlink = true

[preview]
# 图片预览的最大尺寸（像素），Ghostty 高分屏上调大一点更清楚
max_width = 1600
max_height = 1600
image_quality = 85
wrap = "no"
tab_size = 2

[opener]
# 编辑：在当前终端用 nvim 打开
edit = [
  { run = 'nvim "$@"', block = true, desc = "nvim", for = "unix" },
]

# git 状态标记（M 修改 / A 新增 / ? 未跟踪）
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
